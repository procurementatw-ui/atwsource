<script id="atw72-startup">(function () {
  'use strict';

  function waitForShell() {
    if (document.readyState !== 'loading') return Promise.resolve();
    return new Promise(resolve => {
      document.addEventListener('DOMContentLoaded', resolve, { once: true });
    });
  }

  function showFailure(error) {
    window.ATW72Error = String(error.message || error);
    let status = document.getElementById('atw72-start-message');
    if (!status) {
      status = document.createElement('div');
      status.id = 'atw72-start-message';
      status.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:grid;place-content:center;gap:12px;padding:20px;text-align:center;background:#071c2d;color:#fff;font:16px Arial,sans-serif';
      const root = document.documentElement || document.appendChild(document.createElement('html'));
      (document.body || root.appendChild(document.createElement('body'))).appendChild(status);
    }
    status.setAttribute('role', 'alert');
    status.textContent = 'ATW Source could not open. Reload the page to try again.';
    const reload = document.createElement('button');
    reload.type = 'button';
    reload.textContent = 'Reload';
    reload.onclick = () => window.location.reload();
    status.appendChild(reload);
  }

  async function start() {
    try {
      const storage = window.ATWStorageSafe;
      await Promise.all([storage.ready, waitForShell()]);
      // Leave the shell parser's task before replacing its document.
      await new Promise(resolve => setTimeout(resolve, 0));
      const payload = document.getElementById('atw72-application');
      const binary=atob(payload.textContent.trim()),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);let restored;if(typeof DecompressionStream==='function'){try{restored=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}catch{restored=pako.inflate(bytes)}}else restored=pako.inflate(bytes);const html=new TextDecoder().decode(restored);

      document.open();
      if (payload.isConnected) throw new Error('The opening screen could not be replaced.');
      document.write(html);
      document.close();
      if (!document.getElementById('gate') || !document.getElementById('main')) {
        throw new Error('The workspace did not finish opening.');
      }

      storage.attach();
      window.ATW72Ready = true;
      storage.flush();
    } catch (error) {
      showFailure(error);
    }
  }

  start();
})();
</script></body></html>
