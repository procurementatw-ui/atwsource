<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATW Source</title><link rel="icon" href="/assets/favicon.png"><style>*{box-sizing:border-box}body{margin:0;color:#233f50;font:15px/1.55 'Segoe UI',system-ui,sans-serif;background:#edf3f6;min-height:100dvh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:440px;background:#fff;padding:32px;border:1px solid #dce6ec;border-radius:14px;box-shadow:0 14px 45px #163d5510}header{display:flex;align-items:center;justify-content:space-between;gap:20px}header img{width:120px;max-height:64px;object-fit:contain}h1{font-size:27px;line-height:1.25;margin:26px 0 8px;color:#24617c}p{color:#6a7f8a}label{display:grid;gap:8px;margin:22px 0 16px;font-size:13px;font-weight:600}input,select,button{font:inherit;border-radius:7px}input,select{padding:11px;border:1px solid #ccdbe3;min-width:0;max-width:100%}button{padding:11px 16px;border:1px solid #23617e;background:#23617e;color:#fff;font-weight:600;cursor:pointer}button:disabled{opacity:.6}#submit{width:100%}#change{background:transparent;color:#35677e;border:0;padding-left:0;margin-top:8px;font-size:13px}#message{font-size:13px;min-height:22px;white-space:pre-line}#code{letter-spacing:.25em;font-variant-numeric:tabular-nums}select{font-size:12px}footer{border-top:1px solid #e8eef2;margin-top:24px;padding-top:18px;color:#7b909c;font-size:12px}[hidden]{display:none!important}@media(max-width:500px){body{padding:16px}main{padding:24px}}</style></head><body><main><header><img src="/assets/atw-logo.png" alt="ATW Group"><select id="language" aria-label="Language"><option value="en">English</option><option value="id">Bahasa Indonesia</option><option value="zh">简体中文</option></select></header><h1 data-copy="title">ATW Source</h1><p data-copy="lead"></p><form id="login"><label id="email-row"><span data-copy="email"></span><input id="email" type="email" autocomplete="username" required maxlength="254"></label><div id="code-row" hidden><label><span data-copy="code"></span><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" maxlength="8" disabled></label><button type="button" id="change" data-copy="change"></button></div><p id="message" role="status"></p><button id="submit" data-copy="continue"></button></form><footer>ATW Source · Procurement workspace</footer></main><script src="/launcher.js" defer></script></body></html>
